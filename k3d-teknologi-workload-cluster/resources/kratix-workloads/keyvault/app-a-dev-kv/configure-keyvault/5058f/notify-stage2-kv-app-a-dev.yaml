apiVersion: batch/v1
kind: Job
metadata:
  name: notify-stage2-kv-app-a-dev
  namespace: kratix-workloads
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    argocd.argoproj.io/sync-wave: "2"
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: notify-watcher
      imagePullSecrets:
      - name: acr-credentials
      containers:
      - name: notify
        image: teknologieur1acr.azurecr.io/kratix-notify:latest
        env:
        - name: NOTIFY_STAGE
          value: "2"
        - name: RESOURCE_NAME
          value: "kv-app-a-dev"
        - name: RESOURCE_TYPE
          value: "KeyVault"
        - name: REQUESTER_NAMESPACE
          value: "kratix-workloads"
        - name: XR_PLURAL
          value: "xkeyvaults"
        - name: SLACK_WEBHOOK_URL
          valueFrom:
            secretKeyRef:
              name: slack-webhook
              key: url
              optional: true
      restartPolicy: OnFailure
