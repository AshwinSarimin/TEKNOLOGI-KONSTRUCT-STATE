apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  name: xresourcegroups.platform.teknologi.io
spec:
  group: platform.teknologi.io
  names:
    kind: XResourceGroup
    plural: xresourcegroups
  versions:
  - name: v1alpha1
    referenceable: true
    schema:
      openAPIV3Schema:
        properties:
          spec:
            properties:
              location:
                default: westeurope
                type: string
            type: object
        type: object
    served: true
---
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    provider: azure
  name: xresourcegroup-azure
spec:
  compositeTypeRef:
    apiVersion: platform.teknologi.io/v1alpha1
    kind: XResourceGroup
  mode: Pipeline
  pipeline:
  - functionRef:
      name: function-patch-and-transform
    input:
      apiVersion: pt.fn.crossplane.io/v1beta1
      kind: Resources
      resources:
      - base:
          apiVersion: azure.upbound.io/v1beta1
          kind: ResourceGroup
          spec:
            providerConfigRef:
              name: azure-provider
        name: resource-group
        patches:
        - fromFieldPath: spec.location
          policy:
            fromFieldPath: Optional
          toFieldPath: spec.forProvider.location
          type: FromCompositeFieldPath
        - fromFieldPath: metadata.name
          toFieldPath: metadata.annotations[crossplane.io/external-name]
          type: FromCompositeFieldPath
    step: patch-and-transform
