apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  name: xstorageaccounts.platform.teknologi.io
spec:
  group: platform.teknologi.io
  names:
    kind: XStorageAccount
    plural: xstorageaccounts
  versions:
  - name: v1alpha1
    referenceable: true
    schema:
      openAPIV3Schema:
        properties:
          spec:
            properties:
              appName:
                type: string
              environment:
                default: dev
                enum:
                - dev
                - tst
                - acc
                - prd
                type: string
              location:
                default: westeurope
                type: string
              resourceGroupName:
                default: teknologi-eur1-prd-platform-rg
                type: string
              storageAccountName:
                description: Pre-computed Azure storage account name (3-24 chars lowercase
                  alphanumeric)
                type: string
            required:
            - appName
            - environment
            - storageAccountName
            type: object
          status:
            properties:
              primaryBlobEndpoint:
                type: string
              storageAccountName:
                type: string
            type: object
        type: object
    served: true
---
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    provider: azure
  name: xstorageaccount-azure
spec:
  compositeTypeRef:
    apiVersion: platform.teknologi.io/v1alpha1
    kind: XStorageAccount
  mode: Resources
  resources:
  - base:
      apiVersion: storage.azure.upbound.io/v1beta2
      kind: Account
      spec:
        forProvider:
          accountKind: StorageV2
          accountReplicationType: LRS
          accountTier: Standard
          httpsTrafficOnlyEnabled: true
          minTlsVersion: TLS1_2
        providerConfigRef:
          name: azure-provider
    name: storage-account
    patches:
    - fromFieldPath: spec.storageAccountName
      toFieldPath: metadata.name
      type: FromCompositeFieldPath
    - fromFieldPath: spec.storageAccountName
      toFieldPath: metadata.annotations[crossplane.io/external-name]
      type: FromCompositeFieldPath
    - fromFieldPath: spec.location
      policy:
        fromFieldPath: Optional
      toFieldPath: spec.forProvider.location
      type: FromCompositeFieldPath
    - fromFieldPath: spec.resourceGroupName
      policy:
        fromFieldPath: Optional
      toFieldPath: spec.forProvider.resourceGroupName
      type: FromCompositeFieldPath
    - fromFieldPath: metadata.name
      toFieldPath: status.storageAccountName
      type: ToCompositeFieldPath
    - fromFieldPath: status.atProvider.primaryBlobEndpoint
      policy:
        fromFieldPath: Optional
      toFieldPath: status.primaryBlobEndpoint
      type: ToCompositeFieldPath
